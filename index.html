<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>冷間圧延 MPM ラボ</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='-3' r='9' fill='%238a949c'/%3E%3Ccircle cx='8' cy='19' r='9' fill='%238a949c'/%3E%3Crect x='0' y='6.5' width='16' height='3' fill='%231d2a3a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="title">
        <h1>冷間圧延 MPM ラボ</h1>
        <p>薄板がロールを抜けるまでの応力状態と、亀裂が生まれる場所を粒子法で追う</p>
      </div>
      <div class="controls">
        <label class="preset">
          <span>条件</span>
          <select id="preset"></select>
        </label>
        <!-- the conditions no longer match the named one (presetBadge.ts) -->
        <span class="preset-custom" id="preset-custom" hidden></span>
        <button id="run" class="primary" type="button">圧延を始める</button>
        <button id="pause" type="button">一時停止</button>
        <button id="reset" type="button">条件を反映してやり直す</button>
      </div>
      <div class="clock" id="clock" aria-live="off"></div>
    </header>

    <main class="layout">
      <aside class="conditions" id="panel" aria-label="圧延条件">
        <p class="preset-note" id="preset-note"></p>
      </aside>
      <div class="splitter split-left" data-size="left" aria-label="条件の欄の幅（ドラッグか矢印キー、ダブルクリックで元に戻す）"></div>

      <section class="stage section-only" aria-label="ロールバイト">
        <div class="field-tabs" id="field-tabs" role="radiogroup" aria-label="色で表す量"></div>
        <div class="bite">
          <canvas id="bite"></canvas>
          <div class="view-tools" id="view-tools" aria-label="表示の操作">
            <!-- the status line ends the tools' row: on a narrow picture it wraps under them instead of lying over them -->
            <div class="phase" id="phase" aria-live="polite"></div>
          </div>
          <canvas class="overview" id="overview" aria-label="板の全長。クリックでそこを表示"></canvas>
          <div class="legend" id="legend"></div>
        </div>
        <div class="splitter split-charts" data-size="charts" aria-label="グラフの高さ（ドラッグか矢印キー、ダブルクリックで元に戻す）"></div>
        <div class="charts">
          <figure>
            <figcaption>圧延荷重（ロール 1 本あたり、板幅 1 mm あたり）</figcaption>
            <canvas id="chart-force"></canvas>
            <div class="chart-legend" id="legend-force"></div>
          </figure>
          <div class="splitter split-col" data-size="c12" aria-label="荷重とフリクションヒルのグラフの境（ドラッグか矢印キー、ダブルクリックで元に戻す）"></div>
          <figure>
            <figcaption>接触面の圧力と摩擦応力（フリクションヒル）</figcaption>
            <canvas id="chart-hill"></canvas>
            <div class="chart-legend" id="legend-hill"></div>
          </figure>
          <div class="splitter split-col" data-size="c23" aria-label="フリクションヒルと破断軌跡のグラフの境（ドラッグか矢印キー、ダブルクリックで元に戻す）"></div>
          <figure class="locus" id="locus">
            <figcaption>破断軌跡 εf(η) と負荷経路</figcaption>
            <canvas id="chart-locus"></canvas>
          </figure>
        </div>
      </section>

      <section class="plan-stage plan-only" aria-label="平面図（上から見た板）">
        <div class="field-tabs" id="plan-tabs" role="radiogroup" aria-label="色で表す量（平面図）"></div>
        <div class="bite plan-bite">
          <canvas id="plan-canvas"></canvas>
          <div class="view-tools plan-tools" id="plan-tools" aria-label="表示の操作（平面図）"></div>
          <div class="legend" id="plan-legend"></div>
          <div class="phase" id="plan-phase" aria-live="polite"></div>
        </div>
      </section>

      <div class="splitter split-right" data-size="right" aria-label="結果の欄の幅（ドラッグか矢印キー、ダブルクリックで元に戻す）"></div>
      <aside class="record" aria-label="結果">
        <section class="certificate section-only">
          <h2>圧延結果</h2>
          <table id="results"></table>
          <p class="table-note" id="results-note"></p>
          <div class="burst-hint" id="burst-hint"></div>
        </section>
        <section class="certificate stand-results section-only" id="stand-results-section" hidden>
          <h2>スタンドごとの結果</h2>
          <div class="table-scroll"><table id="stand-results"></table></div>
          <p class="table-note">荷重・出側板厚・先進率は各スタンドの定常の平均。次のスタンドの入側板厚は出てきた板の厚さ（弾性の戻りを含む）。伸びた面積は、そのスタンドで亀裂になった材料の断面の面積（前のスタンドから持ち越した亀裂は数え直さない）</p>
        </section>
        <section class="cracks section-only">
          <h2>亀裂の記録</h2>
          <ol id="crack-log" aria-live="polite"></ol>
        </section>
        <section class="explorer section-only" id="explorer" aria-label="応力状態"></section>
        <section class="export section-only" id="export" aria-label="結果の書き出し"></section>
        <section class="certificate plan-only">
          <h2>圧延結果（平面図）</h2>
          <table id="plan-results"></table>
          <p class="table-note" id="plan-results-note"></p>
        </section>
        <section class="cracks plan-only">
          <h2>亀裂の記録（平面図）</h2>
          <ol id="plan-crack-log" aria-live="polite"></ol>
        </section>
        <section class="export plan-only" id="plan-export" aria-label="結果の書き出し（平面図）"></section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
